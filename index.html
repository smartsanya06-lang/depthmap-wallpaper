<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saraswati Vandana</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:
    linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    color:white;
}

/* Three.js Container */
#container{
    position:fixed;
    width:100%;
    height:100%;
    z-index:1;
}

/* Overlay Content */
.overlay{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
    width:90%;
}

/* Main Title */
h1{
    font-size:4rem;
    color:#ffd700;
    text-shadow:
    0 0 10px #ffd700,
    0 0 20px #ffcc00,
    0 0 40px #ffcc00;
    animation: glow 2s infinite alternate;
}

/* Sanskrit Text */
.vandana{
    margin-top:20px;
    font-size:1.5rem;
    line-height:2;
    color:#fff8dc;
    text-shadow:0 0 10px rgba(255,255,255,.6);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.2);
}

/* Floating Circle Effect */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation: float 12s linear infinite;
}

.circle:nth-child(1){
    width:120px;
    height:120px;
    top:10%;
    left:10%;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:10%;
    right:15%;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-40px);
    }
    100%{
        transform:translateY(0px);
    }
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #ffd700;
    }
    to{
        text-shadow:
        0 0 20px #ffd700,
        0 0 40px #ffcc00,
        0 0 80px #ffcc00;
    }
}

/* Responsive */
@media(max-width:768px){
    h1{
        font-size:2.5rem;
    }

    .vandana{
        font-size:1.1rem;
    }
}
</style>
</head>

<body>

<div id="container"></div>

<div class="circle"></div>
<div class="circle"></div>

<div class="overlay">
    <h1>🕉️ सरस्वती वंदना 🕉️</h1>

    <div class="vandana">
        या कुन्देन्दुतुषारहारधवला<br>
        या शुभ्रवस्त्रावृता।<br><br>

        या वीणावरदण्डमण्डितकरा<br>
        या श्वेतपद्मासना॥<br><br>

        या ब्रह्माच्युतशंकरप्रभृतिभिर्देवैः सदा वन्दिता।<br><br>

        सा मां पातु सरस्वती भगवती
        निःशेषजाड्यापहा॥
    </div>
</div>

<script src="js/three.min.js"></script>
<script src="js/dat.gui.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
